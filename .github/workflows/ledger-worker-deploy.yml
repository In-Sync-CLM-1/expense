name: Deploy ledger worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ledger-worker/**'
      - '.github/workflows/ledger-worker-deploy.yml'

concurrency:
  group: ledger-worker-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    name: Test agent gate (may this commit go live?)
    steps:
      - name: Ask the test ledger
        env:
          GATE_TOKEN: ${{ secrets.TEST_GATE_TOKEN }}
        run: |
          r=$(curl -sS -X POST https://test-ledger.echocommunicator.workers.dev/gate \
            -H "Authorization: Bearer $GATE_TOKEN" -H "content-type: application/json" \
            -d "{\"repo\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\",\"workflow\":\"${{ github.workflow }}\"}")
          echo "$r"
          echo "$r" | grep -q '"allow": true' || { echo "::error::Not allowed to go live: $(echo "$r" | sed -n 's/.*"reason": "\(.*\)".*/\1/p')"; exit 1; }

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy expense-sync-ledger
        working-directory: ledger-worker
        run: npx wrangler@latest deploy
